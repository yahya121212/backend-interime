version: '3.8'

services:

  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reallysecret
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: reallysecret
      DATABASE_NAME: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  api:
    build:
      context: ../OCR
      dockerfile: Dockerfile
    container_name: ocr-fastapi
    restart: always
    ports:
      - '8000:8000'
    env_file:
      - ../OCR/.env
    volumes:
      - ../OCR/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  uploads_data:
