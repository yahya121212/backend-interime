version: '3.8'

services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reallysecret
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: interim_backend:latest
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: reallysecret
      DATABASE_NAME: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    volumes:
      - uploads_data:/app/uploads

  api: # OCR
    build:
      context: ../OCR
      dockerfile: Dockerfile
    container_name: ocr-fastapi
    ports:
      - '9000:8000'   # externe 9000 → interne 8000 (FastAPI écoute sur 8000)
    env_file:
      - ../OCR/.env
    volumes:
      - ../OCR/uploads:/app/uploads
    restart: always
    depends_on:
      - backend

  ia: # IA
    build:
      context: ../IA
      dockerfile: Dockerfile
    container_name: ia-service
    ports:
      - '9090:8000'   # externe 9090 → interne 8000 (si ton IA écoute sur 8000)
    env_file:
      - ../IA/.env
    volumes:
      - ../IA/uploads:/app/uploads
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
